<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title data-i18n="nav.assistant">Помощник</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<script src="theme.js"></script>
<script src="theme-apply.js"></script>
</head>
<body data-page="assistant">
<div class="shell">
  <nav class="rail" id="rail" data-shell aria-label="Разделы"></nav>
  <main class="main">
    <header class="topbar">
      <h1 class="topbar__title" data-i18n="nav.assistant">Помощник</h1>
      <div class="topbar__tools"><span id="langHost"></span><button type="button" class="icon-btn" id="themeBtn"></button></div>
    </header>
    <div class="area">
      <p class="hint" id="note" hidden></p>
      <section class="chat" id="chatArea" hidden>
        <p class="hint" data-i18n="assistant.intro">Спросите о товарах обычными словами. Помощник только смотрит и считает — в базе ничего не меняет.</p>
        <div class="chat__log" id="log" role="log" aria-live="polite"></div>
        <div class="chat__examples" id="examples"></div>
        <p class="hint" id="status" aria-live="polite" hidden></p>
        <form class="chat__form" id="form">
          <label class="field">
            <span class="field__label" data-i18n="assistant.your_question">Ваш вопрос</span>
            <textarea class="input" id="question" rows="2" maxlength="1500" data-i18n-attr="placeholder:assistant.placeholder"></textarea>
          </label>
          <div class="chat__actions">
            <button type="submit" class="btn btn--primary" id="sendBtn" data-i18n="assistant.send">Отправить</button>
            <button type="button" class="btn btn--secondary" id="newBtn" data-i18n="assistant.new_chat">Новый разговор</button>
          </div>
        </form>
        <p class="hint" data-i18n="assistant.caution">Это ответ ИИ: важное проверьте на странице «Товары».</p>
      </section>
    </div>
  </main>
</div>
<script src="i18n.js"></script>
<script src="i18n.ru.js"></script>
<script src="i18n.uz.js"></script>
<script src="i18n.uz-cyrl.js"></script>
<script src="i18n.en.js"></script>
<script src="icons.js"></script>
<script src="auth.js"></script>
<script src="assistant.js"></script>
<script src="shell.js"></script>
<script src="boot.js" data-start="Assistant"></script>
<script src="boot.js" data-start="Shell"></script>
</body>
</html>
