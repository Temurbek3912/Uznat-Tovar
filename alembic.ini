# Миграции схемы базы данных (Alembic). Адрес базы берётся из настроек приложения (DATABASE_URL), а не из этого файла.
#
#   python -m scripts.bootstrap                 # обычный путь: bootstrap сам применяет миграции (и принимает старую базу)
#   alembic upgrade head                        # применить все миграции вручную
#   alembic current                             # какая ревизия у базы
#   alembic revision -m "что меняется"          # новая миграция (писать руками; autogenerate — только как черновик)
#
# Порядок и правила — docs/architecture/02_TARGET_ARCHITECTURE.md (миграции) и docs/PLAN_REVIEW_2026-11-13.md (шаг Р-2).
# На рабочей базе владельца миграции запускаются только после проверенной полной копии (этап 2А, отдельное разрешение).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
