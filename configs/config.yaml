# Конфигурация системы Retail Shelf Audit.
# Значения ниже — дефолты для локальной разработки; в проде переопределяются через ENV.

app:
  name: "retail-shelf-audit"
  environment: "development"   # development | staging | production

storage:
  images_bucket: "shelf-images"
  raw_image_retention_days: 30      # хранение исходных фото (комплаенс/приватность)

database:
  url: "postgresql://postgres:postgres@127.0.0.1:5432/shelf_audit"

queue:
  broker_url: "redis://127.0.0.1:6379/0"

auth:
  token_ttl_minutes: 720            # срок жизни токена доступа (F13); 720 = 12 ч, одна смена
  max_failed_logins_per_user: 5     # неудачных входов на ЛОГИН за окно, после чего 429 (защита от подбора пароля)
  max_failed_logins_per_ip: 20      # неудачных входов с одного IP за окно (перебор многих логинов)
  lockout_window_minutes: 15        # длина скользящего окна; блокировка снимается по мере выхода неудач из окна
  mfa_challenge_minutes: 5          # второй шаг входа (код из приложения): сколько минут действует пропуск после пароля
  mfa_max_attempts: 5               # неверных кодов на один пропуск, затем — вход заново с паролем
  require_2fa_for_admins: true      # решения владельца В-2, В-3 (документ 18): второй фактор обязателен всем администраторам, везде
  admin_session_max_hours: 8        # решение В-4: предел сеанса администратора и административного входа; продление его не сдвигает
  reauth_minutes: 10                # важные операции — только если пароль и код подтверждены не раньше чем N минут назад
  temp_password_hours: 24           # срок временного пароля (документ 05, §12.2; Q-19 открыт — рекомендация 24); 0 — без срока
  require_secure_transport: true    # пароли, коды и токены — только по HTTPS или через VPN (решение владельца 2026-11-08, документ 18, §14)

models:
  detector:
    name: "sku110k-yolo11n"
    weights_path: "models/detector/sku110k_yolo11n.pt"   # обученная на SKU-110K YOLO11n: ищет РАМКИ товаров, не название/бренд/штрих-код
    confidence_threshold: 0.35
    iou_threshold: 0.5
    max_detections: 1000        # плотная полка SKU-110K — до ~700 объектов; умолчание Ultralytics (300) обрезало бы результат
  embedder:
    # Модель поиска по виду выбирается по name (app/pipeline/embedder.create_embedder): «siglip…» — SigLIP 2, иначе DINOv2.
    # SigLIP 2 ВКЛЮЧЁН с согласия владельца 2026-11-18; копия до переключения — D:\uznat_tovar\backups-siglip-switch-2026-11-18.
    # Вернуть DINOv2: name "dinov2-base-retail-ft", weights_path "models/embedder/dinov2_base_retail_ft", пороги 0.72 / 0.45,
    # затем python -m scripts.rebuild_index --compute-missing --apply. Как включали (история):
    # Замер 2026-11-18 (docs/benchmark/models_report_2026-11-18.md, §6): SigLIP 2 точнее. Чтобы включить — с согласия владельца:
    #   name: "siglip2-base", weights_path: "", пороги ниже — match 0.88, unknown 0.70; затем копия базы и models/index и
    #   python -m scripts.rebuild_index --compute-missing (индекс старой модели программа не загрузит).
    # Дообученный SigLIP 2 (LoRA на фото каталога, ml/finetune_embedder.py) ВКЛЮЧЁН 2026-11-28: честная проверка по 5 частям
    # (docs/benchmark/finetune_report_2026-11-28.md) — верный первым 73,6 % вместо 70,1 %, с правилом двойника «найдено» 424
    # вместо 356, неверно 0 вместо 2. Копия до включения — D:/uznat_tovar/backups-finetune-2026-11-28. Папки модели в git нет:
    # python -m ml.finetune_check --install <lora_final.pt>. Вернуть: weights_path "", projection_path
    # "models/projection/siglip2-base.npz", match_threshold 0.83, затем python -m scripts.rebuild_index --apply --compute-missing
    # (векторы прежней модели — в кэше базы). Нет папки на диске — программа возьмёт публичную модель и попросит пересборки.
    name: "siglip2-base"
    weights_path: "models/embedder/siglip2-base-shop-ft"
    embedding_dim: 768
    # Лёгкая проекция поверх векторов SigLIP 2 (замер 2026-11-22, docs/benchmark/projection_report_2026-11-22.md): верный товар
    # первым 70 % вместо 63 % на товарах, которых проекция не видела. ВКЛЮЧЕНА с согласия владельца 2026-11-22; копия до
    # включения — D:/uznat_tovar/backups-projection-2026-11-22. Файл обучается командой python -m ml.train_projection (переобучать,
    # когда товаров заметно прибавится). Выключить: "" и пороги ниже 0.86 / 0.04, затем
    # python -m scripts.rebuild_index --apply --compute-missing (векторы без проекции — в кэше базы, фото не пересчитываются).
    projection_path: "models/projection/siglip2-base-shop-ft.npz"   # для дообученной: python -m ml.train_projection --skip-check --out <этот файл>
  matcher:
    index_path: "models/index/catalog.faiss"
    top_k: 5
    match_threshold: 0.84       # дообученный SigLIP 2 с проекцией, запас 0.08 (ml.finetune_check, 2026-11-28). Прежняя модель — 0.83. SigLIP 2 с проекцией, вместе с запасом 0.08 (ml/train_projection.py, 2026-11-22); ниже -> "uncertain", в очередь на ручную проверку. Без проекции — 0.86 / 0.04
    unknown_threshold: 0.70     # SigLIP 2; ниже -> "unknown" (товар не из каталога). У DINOv2 были 0.72 / 0.45
    margin_threshold: 0.08      # второй товар ближе 0.08 к первому -> "uncertain" (похожие товары одной марки). С проекцией векторы разных товаров дальше друг от друга — запас шире. 0 = выключено
    # Правило двойника (2026-11-23, docs/benchmark/twins_report_2026-11-23.md): среди кандидатов есть товар, чьи фото в каталоге
    # почти как у лучшего (сходство >= 0.80: вкусы и объёмы одной линейки) -> "uncertain", человек выбирает из вариантов.
    # Честная проверка: уверенных ошибок 23 -> 2 из 1290 снимков, «найдено» 413 -> 356. 0 = выключено (как раньше). Значение —
    # для SigLIP 2 с проекцией; для другой модели подобрать заново: python -m ml.check_twins
    twin_threshold: 0.80
    # Строгий режим: «найдено» только при счёте >= strict_match_threshold. Честная проверка: уверенных ошибок 0, чужой товар
    # принят 0,7 % (вместо 3 %), но «найдено» только у 15 % снимков (вместо 28 %), остальное — «похоже, выберите». true — включить
    strict: false
    strict_match_threshold: 0.88

# «Назвать любой товар» (документ 07, §10.6): если товара нет в базе — назвать его и попросить обратиться к сотруднику.
naming:
  enabled: true
  barcode_lookup: true                       # штрихкод -> открытые базы (Open Food Facts и др.); уходит только номер штрихкода
  vision_url: "http://127.0.0.1:1234/v1"     # локальная модель «зрение + текст» (LM Studio). Кадр не покидает компьютер. "" — выключить
  vision_model: "qwen/qwen3-vl-4b"
  vision_timeout_seconds: 40                 # первый запрос после запуска LM Studio загружает модель — бывает долгим
  min_confidence: high                       # ниже — «не удалось определить». Замер 2026-11-14: «medium» неверны 4 из 4 (07, §10.6)
  size_question: true                       # рядом другой объём того же товара -> спросить модель, какой объём на этикетке (верно 61 из 62, замер 2026-11-21). false — как раньше

pipeline:
  max_image_side_px: 2048
  blur_face_detection: true     # обязательное размытие лиц людей в кадре (privacy)

osa:
  empty_slot_confidence: 0.6

alerts:
  critical_oos_threshold_pct: 15   # алерт, если доля пустых слотов на полке выше X%
