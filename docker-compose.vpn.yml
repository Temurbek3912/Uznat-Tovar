# Административный вход через VPN (решение владельца В-1, документ 18, §4 и §12; инструкция — docs/REMOTE_ACCESS_GUIDE.md, п. 6).
#
# Подключается ТОЛЬКО после того, как VPN настроен и у компьютера магазина есть адрес в VPN-сети (например, 100.x.y.z у Tailscale
# или 10.8.0.1 у WireGuard). Впишите его в .env:  VPN_BIND_IP=100.64.1.10   и запустите ДВУМЯ командами:
#
#     docker compose up -d
#     docker compose -f docker-compose.yml -f docker-compose.vpn.yml up -d --no-deps admin-api-vpn
#
# Первая — вся программа, как обычно; вторая — ТОЛЬКО VPN-вход. Не запускайте обе части одной командой
# («-f docker-compose.vpn.yml up -d» без «--no-deps admin-api-vpn»): испытано 2026-11-21 на Docker Desktop для Windows — если адрес
# VPN не занят (VPN не подключён, опечатка в адресе), Compose прерывает запуск и тех служб, которые создаёт в этот же раз, в том
# числе admin-api; после обновления образа или правки .env вход на самом компьютере остался бы выключен.
# Остановить всё: docker compose -f docker-compose.yml -f docker-compose.vpn.yml down — просто «docker compose down» VPN-вход
# НЕ останавливает (Compose считает его чужой службой, «orphan»). Предупреждение «Found orphan containers (…admin-api-vpn…)»
# при «docker compose up -d» — то же самое, оно безопасно: VPN-вход продолжает работать.
#
# Устройство:
#  * ОТДЕЛЬНАЯ служба admin-api-vpn (тот же образ, та же база, тот же вход «admin»), а не второй порт у admin-api. Если VPN ещё не
#    поднят (например, после перезагрузки Windows Docker запустился раньше VPN), Docker не сможет занять адрес VPN и не запустит
#    ЭТУ службу — административный вход на самом компьютере (admin-api, 127.0.0.1:8001) продолжит работать. После подключения VPN
#    повторите вторую команду.
#  * Порт публикуется ТОЛЬКО на адресе VPN — не на 0.0.0.0: из локальной сети магазина и из интернета он недоступен. Без VPN_BIND_IP
#    запуск остановится с ошибкой, а не откроет порт всем.
#  * VPN_BIND_IP передаётся и в программу: запросы по этому адресу (заголовок Host) получают права управления; по чужому имени —
#    нет (защита от подмены DNS, app/core/mfa_policy.py, effective_listener). Другие имена — ADMIN_ALLOWED_HOSTS.
#
# ПРОВЕРЕНО 2026-11-21 (Docker Desktop для Windows, адрес адаптера Tailscale, временный проект; docs/ENGINEERING_STATUS.md, §3):
# порт занимается на адресе VPN рядом с 127.0.0.1:8001 (тот же номер порта), по адресу Wi-Fi 8001 не открывается, права управления —
# только по адресу VPN, по чужому имени — нет; неподнятый адрес VPN — ошибка только этой службы (с командой выше).
# НЕ ПРОВЕРЕНО: вход с другого устройства в VPN — брандмауэр Windows (у Docker Desktop разрешение бывает только для профиля сети
# «Общедоступная», а адаптер VPN обычно «Частная»; docs/REMOTE_ACCESS_GUIDE.md, п. 6) и автозапуск после перезагрузки Windows
# (документ 18, §12.2). Альтернатива без привязки к адресу VPN — «tailscale serve» к 127.0.0.1:8001 (там же).
services:
  admin-api-vpn:
    image: retail-shelf-audit:latest
    pull_policy: never
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${VPN_BIND_IP:?Укажите VPN_BIND_IP в .env — адрес этого компьютера в VPN-сети}:${ADMIN_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-shelf_audit}
      QUEUE_BROKER_URL: redis://redis:6379/0
      FRAMES_REDIS_URL: redis://frames:6379/0     # кадры «Узнать товар» — только в памяти (D-10а)
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ALLOW_DEBUG_EMBEDDER: ${ALLOW_DEBUG_EMBEDDER:-0}
      ALLOW_HEURISTIC_DETECTOR: ${ALLOW_HEURISTIC_DETECTOR:-0}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Tashkent}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      APP_LISTENER: admin
      VPN_BIND_IP: ${VPN_BIND_IP:-}
      ADMIN_ALLOWED_HOSTS: ${ADMIN_ALLOWED_HOSTS:-}
    volumes:
      - .:/srv/app
      - hf_cache:/root/.cache/huggingface
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      frames:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
